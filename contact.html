<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Wagamama Menu Guide</title>
    <meta name="description" content="Get in touch with the team behind the UK's top Wagamama menu guide.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <div class="logo">Wagamama Menu Guide</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <h1>Contact Us</h1>
        <div style="max-width: 600px;">
            <p>Have a question about a dish, or want to suggest a new review? Send us a message using the form below, and we'll get back to you as soon as possible.</p>
            
            <form action="#" method="POST" style="margin-top: 30px;">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Wagamama Menu Guide. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
